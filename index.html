:root{color-scheme:light dark;--bg:light-dark(#f4f2ee,#16171a);--panel:light-dark(#ffffff,#1f2024);--ink:light-dark(#1b1b1b,#ecebe7);--mute:light-dark(#6b6862,#9d9a94);--line:light-dark(#dedad2,#34353a);--accent:#d23c2a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;overflow:hidden;display:grid;grid-template-columns:300px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 20px 28px;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:6px 0 0}
h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;font-size:13px;min-height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer;padding:6px 10px}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;font-size:14px}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;color:var(--mute)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rooms button{text-align:left;min-height:38px}
.rooms button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.dims{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.dims b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
main{position:relative;overflow:hidden;background:#111}
#view{position:absolute;inset:0}
#view canvas{display:block}
.lbl{font:600 12px "IBM Plex Sans KR",system-ui,sans-serif;color:#1b1b1b;background:rgba(255,255,255,.86);padding:2px 7px;border-radius:3px;white-space:nowrap;pointer-events:none;border:1px solid rgba(0,0,0,.08)}
.hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:#ddd;background:rgba(20,20,20,.62);padding:5px 10px;border-radius:4px;pointer-events:none}
#fade{position:absolute;inset:0;background:#0c0c0c;opacity:0;pointer-events:none;transition:opacity .4s ease}
#rbar{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 10px;border-radius:8px;background:rgba(18,18,18,.66);color:#f2f0ea;backdrop-filter:blur(8px)}
#rbar[hidden]{display:none}
#rbar button{color:#f2f0ea;border-color:rgba(255,255,255,.25);min-height:36px}
#rbar button.on{background:#f2f0ea;color:#151515}
#rname{font-size:17px;font-weight:600;margin-right:auto;white-space:nowrap}
#rbar .tg{display:flex;gap:4px}
#rbar label{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
#rbar input[type=range]{width:110px}
#err{position:absolute;left:14px;bottom:14px;right:14px;color:#ff8a7a;font-size:13px}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:58vh 1fr}main{grid-row:1}aside{grid-row:2;border-right:0;border-top:1px solid var(--line)}.hint{display:none}#rbar input[type=range]{width:80px}}
@media(prefers-reduced-motion:reduce){#fade{transition:none}}

  </section>

</aside>

const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

function woodTex() { // 2m × 2m 오크 마루, 폭 약 220mm
  const n = 1024, P = 9, ph = n / P, cm = cv(n), cb = cv(n), g = cm.getContext('2d'), b = cb.getContext('2d'), r = rng(11);

const T = {

function block(r, y0, y1, model, real, parent = scene, edges = true) {
  const [x1, z1, x2, z2] = r;
  const g = new THREE.BoxGeometry(Math.abs(x2 - x1) * S, 1, Math.abs(z2 - z1) * S); g.translate(0, .5, 0);
  const m = new THREE.Mesh(g, model);
  m.position.set(X((x1 + x2) / 2), y0, Z((z1 + z2) / 2));
  m.scale.y = y1 - y0;
  m.castShadow = model !== glass; m.receiveShadow = true;
  if (edges) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat); m.add(l); edgeLines.push(l); }
  parent.add(m);
  cuttable.push({ m, y0, y1 });
  if (real) { m.userData.mm = model; m.userData.mr = real; swaps.push(m); }
  return m;
}
function boxW(cx, cy, cz, sx, sy, sz, mat, parent = realGroup, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  m.position.set(cx, cy, cz); m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m;
}

  block(gw, sill, head, glass);
  block([a, b, c, d], head, H, wallModel, mr.wall);
});

  m.userData.mm = mm[t]; m.userData.mr = real; swaps.push(m);
});

let composer = null, gtao = null, bloom = null;
function makeComposer() {
  const w = host.clientWidth, h = host.clientHeight;
  const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  gtao = new GTAOPass(scene, camera, w, h);
  gtao.updateGtaoMaterial({ radius: .6, distanceExponent: 1.3, thickness: 1.2, scale: 1.5, samples: 16 });
  composer.addPass(gtao);
  bloom = new UnrealBloomPass(new THREE.Vector2(w, h), .22, .5, .92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}

  if (!real) return;
  const day = t === 'day';
  sun.intensity = day ? 3.4 : 0; sun.color.set(0xfff0da);
  hemi.intensity = day ? .1 : .03; hemi.color.set(day ? 0xdfe8ff : 0x30364a); hemi.groundColor.set(0x8a7f70);
  scene.environmentIntensity = day ? .2 : .05;
  rects.forEach(l => l.intensity = day ? 2.2 : .15);
  points.forEach(([p, k]) => p.intensity = day ? 0 : 11 * k);
  mr.bulb.emissiveIntensity = day ? 0 : 7;
  if (day) { skyU.top.value.setRGB(.28, .48, .92); skyU.hor.value.setRGB(.92, .95, 1); skyU.bot.value.setRGB(.5, .52, .55); skyU.k.value = 2.6; }
  else { skyU.top.value.setRGB(.015, .025, .07); skyU.hor.value.setRGB(.32, .2, .22); skyU.bot.value.setRGB(.02, .02, .03); skyU.k.value = 1; }
}

  setShadowSize(on ? 4096 : 2048);
  Object.assign(controls, on
    ? { rotateSpeed: -.35, enableZoom: false, enablePan: false, minPolarAngle: .25, maxPolarAngle: Math.PI - .25, dampingFactor: .08 }
    : { rotateSpeed: 1, enableZoom: true, enablePan: true, minPolarAngle: 0, maxPolarAngle: Math.PI * .495, dampingFactor: .05 });
  if (on) { sun.position.set(-5, 8, 13); setTime(timeOfDay); }
  else { sun.position.set(-8, 14, 10); sun.intensity = 2.2; sun.color.set(0xfff4e6); hemi.intensity = 1.6; hemi.color.set(0xffffff); hemi.groundColor.set(0xb8b0a4); }
  $('rbar').hidden = !on;
  $('hint').textContent = on ? '드래그로 둘러보기 · 휠 화각 · W A S D / 방향키 이동' : '드래그 회전 · 우클릭 이동 · 휠 확대';
  renderer.setPixelRatio(Math.min(devicePixelRatio, on ? 1.5 : 2));
  resize();
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function transition(fn) {
  if (reduce) { fn(); return; }
  fade.style.opacity = 1;
  setTimeout(() => { fn(); requestAnimationFrame(() => requestAnimationFrame(() => fade.style.opacity = 0)); }, 420);
}
const roomBtns = [];
function enterRoom(i) {
  const [name, , , , eye, look] = rooms[i];
  roomBtns.forEach((b, j) => b.classList.toggle('on', j === i));
  setBtn(null);
  transition(() => {
    if (!real) setReal(true);
    anim = null;
    const e = V(X(eye[0]), 1.5, Z(eye[1]));
    const dir = V(X(look[0]), 1.3, Z(look[1])).sub(e).normalize();
    camera.position.copy(e); controls.target.copy(e).addScaledVector(dir, .05);
    camera.fov = name.startsWith('욕실') || name === '대피실' || name === '다용도실' ? 74 : 62; camera.updateProjectionMatrix();
    controls.update();
    $('rname').textContent = name;
  });
}
function fly(pos, tgt, fov = 40) {
  anim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), f0: camera.fov, p1: pos, t1: tgt, f1: fov };
}
const views = {
  vIso: () => fly(V(11, 15, 15), V(0, 0, 0)),
  vTop: () => fly(V(0, 27, 0.01), V(0, 0, 0), 38),
  vEye: () => fly(V(X(450), 1.55, Z(880)), V(X(480), 1.2, Z(300)), 62)
};
function setBtn(id) { document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.id === id)); }
function toModel(id = 'vIso') {
  const go = () => { roomBtns.forEach(b => b.classList.remove('on')); setBtn(id); views[id](); };
  if (real) transition(() => { setReal(false); camera.position.set(11, 15, 15); controls.target.set(0, 0, 0); camera.fov = 40; camera.updateProjectionMatrix(); go(); });
  else go();
}
Object.keys(views).forEach(id => $(id).addEventListener('click', () => toModel(id)));
$('back').addEventListener('click', () => toModel('vIso'));
rooms.forEach(([n], i) => {
  const b = document.createElement('button'); b.textContent = n;
  b.addEventListener('click', () => enterRoom(i));
  $('rooms').appendChild(b); roomBtns.push(b);
});
$('tDay').addEventListener('click', () => setTime('day'));
$('tEve').addEventListener('click', () => setTime('eve'));
expo.addEventListener('input', () => { if (real) renderer.toneMappingExposure = +expo.value; });

// ---------- 모형 UI ----------
cut.addEventListener('input', () => {
  const v = +cut.value; applyCut(v);
  $('cutVal').textContent = Math.round(v * 1000).toLocaleString('ko-KR') + ' mm' + (v >= 2.4 ? ' (천장고)' : ' 단면');
});
$('tFurn').addEventListener('change', e => { if (!real) furnGroup.visible = e.target.checked; });
$('tLbl').addEventListener('change', e => { if (!real) labelGroup.visible = e.target.checked; });
const planOp = $('planOp');
$('tPlan').addEventListener('change', e => { if (!real) plan.visible = e.target.checked; planOp.disabled = !e.target.checked; });
planOp.addEventListener('input', () => planMat.opacity = +planOp.value);

// 실사 모드: 휠 = 화각, 키보드 = 이동
renderer.domElement.addEventListener('wheel', e => {
  if (!real) return; e.preventDefault();
  camera.fov = Math.min(85, Math.max(30, camera.fov + e.deltaY * .03)); camera.updateProjectionMatrix();
}, { passive: false });
const keys = {};
const keyMap = { KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };
addEventListener('keydown', e => { if (real && keyMap[e.code] && !/INPUT|BUTTON/.test(document.activeElement?.tagName || '')) { keys[keyMap[e.code]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- 루프 ----------
function resize() {
  const w = host.clientWidth, h = Math.max(host.clientHeight, 1);
  renderer.setSize(w, h); labelR.setSize(w, h);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
const ro = new ResizeObserver(resize); ro.observe(host);
camera.position.set(11, 15, 15); controls.target.set(0, 0, 0);
resize();
const clock = new THREE.Clock(), fwd = V(0, 0, 0), side = V(0, 0, 0), up = V(0, 1, 0);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (anim) {
    anim.t = reduce ? 1 : Math.min(1, anim.t + dt / .9);
    const k = 1 - Math.pow(1 - anim.t, 3);
    camera.position.lerpVectors(anim.p0, anim.p1, k);
    controls.target.lerpVectors(anim.t0, anim.t1, k);
    camera.fov = anim.f0 + (anim.f1 - anim.f0) * k; camera.updateProjectionMatrix();
    if (anim.t >= 1) anim = null;
  }
  if (real && (keys.f || keys.b || keys.l || keys.r)) {
    fwd.subVectors(controls.target, camera.position).setY(0).normalize();
    side.crossVectors(fwd, up);
    const mv = V(0, 0, 0).addScaledVector(fwd, (keys.f ? 1 : 0) - (keys.b ? 1 : 0)).addScaledVector(side, (keys.r ? 1 : 0) - (keys.l ? 1 : 0));
    if (mv.lengthSq()) { mv.normalize().multiplyScalar(1.3 * dt); camera.position.add(mv); controls.target.add(mv); }
  }
  controls.update();
  if (real) composer.render();
  else { renderer.render(scene, camera); labelR.render(scene, camera); }
});
}
</script>
<script>
window.addEventListener('error', e => { const el = document.getElementById('err'); if (el) el.textContent = '3D 모형 오류: ' + (e.message || ''); });
</script>
